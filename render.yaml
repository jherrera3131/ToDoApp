services:
  - type: web
    name: mysite
    runtime: ruby
    plan: free
    buildCommand: './bin/render-build.sh'
    startCommand: './bin/rails server'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysite-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        value: '79d85fbaf4fb58b67dd5b7b6dda6874c'
        sync: false
      - key: WEB_CONCURRENCY
        value: 2
databases:
  - name: mysite-db
    plan: free